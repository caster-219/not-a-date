<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>出去晃晃？</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;background:radial-gradient(circle at top,#fff4f6 0%,#f8dce4 48%,#efc9d4 100%);color:#49383e;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(420px,100%);min-height:610px;background:rgba(255,255,255,.96);border-radius:30px;padding:28px 24px 32px;box-shadow:0 20px 60px rgba(110,65,78,.16);text-align:center}
.page{display:none;animation:fadeIn .3s ease} .page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.lotso{width:205px;max-width:64vw;height:auto;display:block;margin:0 auto 10px}
h1{font-size:29px;line-height:1.35;margin:10px 0} h2{font-size:25px;margin:10px 0}
p{color:#80646d;line-height:1.65}
.progress-wrap{margin-bottom:26px;text-align:left}
.progress-info{display:flex;justify-content:space-between;font-size:13px;color:#94727c;margin-bottom:8px}
.progress-bar{height:7px;background:#eadde1;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:25%;background:#cf718b;border-radius:999px;transition:width .35s ease}
button{border:0;border-radius:999px;padding:14px 24px;font-size:16px;cursor:pointer;transition:.22s ease}
.button-area{min-height:150px;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap}
.yes-btn{background:#cf718b;color:#fff;box-shadow:0 8px 22px rgba(160,70,95,.24);position:relative;z-index:2}
.no-btn{background:#eee9eb;color:#66545a;position:relative;z-index:3}
#noMessage{min-height:26px;font-size:14px;color:#966477}
.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
.option{min-height:108px;padding:16px 8px;background:#faf2f4;border:2px solid transparent;border-radius:20px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:.2s ease;user-select:none}
.option:hover{transform:translateY(-2px)} .option.selected{background:#f3d9e0;border-color:#cf718b;box-shadow:0 7px 18px rgba(160,70,95,.12)}
.icon{font-size:31px;margin-bottom:8px}
.nav{display:flex;gap:10px;margin-top:16px} .back{flex:1;background:#eee9eb;color:#66545a} .next{flex:2;background:#cf718b;color:#fff}
.next:disabled{opacity:.35;cursor:default}
input{width:100%;padding:15px;margin-bottom:12px;border:1px solid #dfd0d5;border-radius:15px;font-size:16px;color:#49383e;background:#fff}
.summary{text-align:left;background:#faf2f4;border-radius:19px;padding:20px;margin:20px 0;line-height:2}
.tiny{font-size:13px;opacity:.65}
.submit-status{min-height:24px;margin-top:12px;font-size:14px;color:#80646d}
.submit-status.error{color:#a3485e}
.submit-status.success{color:#4f765b}
@media(max-width:380px){.card{padding:24px 18px 28px}h1{font-size:26px}.lotso{width:180px}}
</style>

<style id="mockup-inspired-skin">
:root{
  --pink:#ed2f72;
  --pink2:#ff6f9e;
  --ink:#3d3540;
  --muted:#7d737b;
  --line:#f1d9e2;
  --card:#fffdfd;
  --soft:#fff4f7;
}
*{box-sizing:border-box}
body{
  min-height:100vh;
  margin:0;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,255,255,.96) 0 12%,transparent 32%),
    radial-gradient(circle at 90% 85%,rgba(255,255,255,.9) 0 10%,transparent 28%),
    linear-gradient(135deg,#fff9fb 0%,#fff0f5 48%,#fdebf2 100%);
}
.wrap{
  width:min(94vw,680px)!important;
  margin:34px auto!important;
}
.card{
  background:rgba(255,255,255,.92)!important;
  border:1px solid rgba(237,47,114,.14)!important;
  border-radius:28px!important;
  box-shadow:0 18px 55px rgba(155,69,101,.13)!important;
  padding:34px!important;
  backdrop-filter:blur(10px);
}
h1,h2{
  color:var(--pink)!important;
  letter-spacing:-.03em;
}
h1{
  font-size:clamp(30px,6vw,46px)!important;
  line-height:1.22!important;
  margin:8px auto 16px!important;
}
h2{
  font-size:clamp(27px,5vw,36px)!important;
  margin:8px 0 8px!important;
}
p{color:var(--muted)!important}
.lotso{
  display:block;
  width:min(76%,330px)!important;
  max-height:310px;
  object-fit:contain;
  margin:10px auto 18px!important;
  filter:drop-shadow(0 14px 18px rgba(118,57,80,.12));
}
.progress{
  margin-bottom:30px!important;
}
.progress-track{
  height:5px!important;
  background:#f2e5e9!important;
  border-radius:99px!important;
}
.progress-fill{
  background:linear-gradient(90deg,var(--pink2),var(--pink))!important;
  border-radius:99px!important;
}
.progress-text{
  color:var(--pink)!important;
  font-weight:800!important;
}
.option-grid{
  gap:14px!important;
  margin-top:24px!important;
}
.option{
  min-height:92px!important;
  background:#fff!important;
  border:1.5px solid var(--line)!important;
  border-radius:17px!important;
  box-shadow:0 6px 14px rgba(125,77,95,.08)!important;
  font-size:17px!important;
  font-weight:700!important;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease!important;
}
.option:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(125,77,95,.12)!important;
  border-color:#f3a4bf!important;
}
.option.selected{
  color:var(--pink)!important;
  border:2px solid var(--pink)!important;
  background:#fff5f8!important;
  box-shadow:0 8px 22px rgba(237,47,114,.13)!important;
}
.option .icon{
  font-size:31px!important;
  margin-bottom:7px!important;
}
button,.next,.yes{
  border-radius:14px!important;
  font-weight:800!important;
}
.next,.yes{
  color:#fff!important;
  background:linear-gradient(135deg,var(--pink2),var(--pink))!important;
  box-shadow:0 8px 18px rgba(237,47,114,.22)!important;
}
.back,.no{
  background:#fff!important;
  color:#61565e!important;
  border:1px solid #eadde2!important;
  box-shadow:0 5px 13px rgba(96,73,82,.08)!important;
}
input[type="date"],input[type="time"]{
  width:100%!important;
  min-height:58px!important;
  border:1.5px solid var(--line)!important;
  border-radius:15px!important;
  background:#fff!important;
  padding:0 16px!important;
  margin:8px 0!important;
  font-size:17px!important;
  color:var(--ink)!important;
  box-shadow:0 5px 14px rgba(125,77,95,.06)!important;
}
#summary{
  background:#fff7fa!important;
  border:1px solid #f4d9e3!important;
  border-radius:18px!important;
  padding:20px!important;
  line-height:1.9!important;
  text-align:left!important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.8);
}
#page1,#page7{text-align:center}
#page7 h2{
  font-size:clamp(32px,6vw,44px)!important;
}
@media(max-width:560px){
  .wrap{width:94vw!important;margin:18px auto!important}
  .card{padding:23px 18px!important;border-radius:23px!important}
  .option-grid{grid-template-columns:1fr 1fr!important;gap:10px!important}
  .option{min-height:86px!important;font-size:15px!important;padding:12px 8px!important}
  .lotso{width:min(82%,285px)!important}
}
</style>

</head>

<h2>成交 😎</h2>
<p>很期待那天與阿mo見面</p>
<div id="summary" class="summary"></div>
<div class="nav"><button class="back" onclick="showPage(6)">← 修改</button></div>
<p class="tiny">行程僅供參考，當天想去哪就去哪。</p>
</section>
</div>

<script>
// 將部署完成後的 Google Apps Script Web App URL 貼在下面。
// 範例：https://script.google.com/macros/s/XXXXXXXX/exec
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNuR_tnVOeMJGQlwKmzxAxfu27yXZqv1VZJu59KefugIzB0432fYI26Y34OVyAokG0bg/exec";

const answers={activity:"",food:"",after:"",transport:"",date:"",time:""};
let noCount=0;
function random(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function rejectDate(){
 noCount++;
 const y=document.getElementById("yesBtn"),n=document.getElementById("noBtn"),m=document.getElementById("noMessage");
 y.style.transform=`scale(${1+noCount*.25})`;
 const msgs=["妳確定？ 🤨","再想一下。","這個答案好像怪怪的 👀","系統似乎不接受這個選項。","「好啊」怎麼越來越大了 😂","不要再掙扎了。","現在應該知道要按哪個了吧 😌"];
 m.textContent=msgs[Math.min(noCount-1,msgs.length-1)];
 if(noCount>=3)n.style.transform=`translate(${random(-80,80)}px,${random(-25,25)}px)`;
}
function acceptDate(){document.getElementById("yesBtn").style.transform="scale(1)";showPage(2)}
function showPage(n){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById("page"+n).classList.add("active");
 restoreSelections();restoreDateTime();updateProgress(n);
}
function updateProgress(n){
 const w=document.getElementById("progressWrap");
 if(n===1||n===7){w.style.display="none";return}
 w.style.display="block";const s=n-1;
 document.getElementById("progressText").textContent=`${s} / 5`;
 document.getElementById("progressFill").style.width=`${s*20}%`;
}
function selectOption(t,v,e){
 answers[t]=v;e.parentElement.querySelectorAll(".option").forEach(o=>o.classList.remove("selected"));e.classList.add("selected");updateButtons();
}
function updateButtons(){
 document.getElementById("activityNext").disabled=!answers.activity;
 document.getElementById("foodNext").disabled=!answers.food;
 document.getElementById("afterNext").disabled=!answers.after;
 document.getElementById("transportNext").disabled=!answers.transport;
}
function restoreSelections(){
 document.querySelectorAll(".option-grid").forEach(g=>{const t=g.dataset.type;if(!t)return;g.querySelectorAll(".option").forEach(o=>{o.classList.toggle("selected",o.dataset.value===answers[t])})});updateButtons();
}
function saveDateTime(){answers.date=document.getElementById("dateInput").value;answers.time=document.getElementById("timeInput").value}
function restoreDateTime(){document.getElementById("dateInput").value=answers.date;document.getElementById("timeInput").value=answers.time}
async function finishForm(){
  saveDateTime();

  const status = document.getElementById("submitStatus");
  const btn = document.getElementById("submitBtn");

  if(!answers.activity || !answers.food || !answers.after || !answers.transport){
    status.className = "submit-status error";
    status.textContent = "前面的選項還沒選完喔。";
    return;
  }

  if(SCRIPT_URL.includes("PASTE_YOUR")){
    status.className = "submit-status error";
    status.textContent = "尚未設定回覆接收網址。";
    return;
  }

  btn.disabled = true;
  status.className = "submit-status";
  status.textContent = "正在送出回覆…";

  // 先準備成交頁內容
  document.getElementById("summary").innerHTML =
    `🎯 <strong>想做：</strong>${answers.activity}<br>` +
    `🍽️ <strong>想吃：</strong>${answers.food}<br>` +
    `🌙 <strong>續攤：</strong>${answers.after}<br>` +
    `🚙 <strong>交通：</strong>${answers.transport}<br>` +
    `📅 <strong>日期：</strong>${answers.date || "當天再決定"}<br>` +
    `🕐 <strong>時間：</strong>${answers.time || "再說"}`;

  const payload = JSON.stringify(answers);

  try {
    // GitHub Pages / 一般瀏覽器：用 no-cors POST 傳到 Apps Script
    // keepalive 讓頁面切換時 request 仍可完成
    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      keepalive: true,
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: payload
    }).catch(() => {});

    // 不讓 Preview / CORS 狀態卡住成交頁
    setTimeout(() => {
      status.className = "submit-status success";
      status.textContent = "已送出。";
      showPage(7);
      btn.disabled = false;
    }, 350);

  } catch(err) {
    status.className = "submit-status error";
    status.textContent = "送出失敗，請再試一次。";
    btn.disabled = false;
  }
}
</script>
